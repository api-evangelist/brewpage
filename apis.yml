  - type: GettingStarted
    url: https://brewpage.app/llms.txt
  - type: Authentication
    url: https://brewpage.app/llms-full.txt
  - type: SDKs
    url: https://www.npmjs.com/package/brewpage-mcp
  - type: Plans
    url: plans/brewpage-plans-pricing.yml
  - type: RateLimits
    url: rate-limits/brewpage-rate-limits.yml
  - type: FinOps
    url: finops/brewpage-finops.yml
  - type: Integrations
    data:
      - name: Model Context Protocol (MCP)
        description: >-
          Official MCP server `brewpage-mcp` exposes BrewPage to any LLM/agent (Claude, Codex, Gemini, Cursor) via the
          Model Context Protocol.
      - name: Claude Code
        description: >-
          Claude Code skill `brewdoc:publish` lets users publish from inside Claude Code via a slash command
          (claude-brewcode marketplace).
      - name: IndexNow
        description: >-
          BrewPage submits public content to IndexNow for search engine discovery; PUT-based republish is recommended to
          preserve quota.
      - name: OpenGraph / Social Bots
        description: >-
          Every short URL exposes `/preview/{ns}/{id}.png` (1200×630) and a `/preview-html/{ns}/{id}` OG stub for link
          unfurling.
      - name: Prism.js
        description: >-
          Client-side syntax highlighting for known code/data file previews (JSON, XML, SVG, HTML, CSS, JS, TS, YAML,
          TOML, Markdown).
      - name: llms.txt
        description: BrewPage publishes a /llms.txt and /llms-full.txt manifest for LLM-friendly discovery of the API surface.
    sources:
      - https://brewpage.app/llms.txt
      - https://brewpage.app/llms-full.txt
    updated: '2026-05-16'
  - type: SpectralRules
    url: rules/brewpage-rules.yml
  - type: Vocabulary
    url: vocabulary/brewpage-vocabulary.yml
  - type: JSONLD
    url: json-ld/brewpage-context.jsonld
  - type: Features
    data:
      - name: Instant HTML Hosting
        description: POST raw HTML or a JSON body to /api/html and receive a 10-char short URL at /{ns}/{id} with no signup.
      - name: Markdown Rendering
        description: Pass `format=markdown` to publish Markdown that BrewPage renders to styled HTML at view time.
      - name: Multi-File Site Hosting
        description: >-
          Upload a ZIP archive or files+paths multipart to /api/sites; entry point auto-detected (index.html preferred);
          20 MB / 100 files / 5 MB each.
      - name: File Hosting
        description: >-
          Upload binary or text files via /api/files (5 MB max). Images, PDFs, video, and audio display inline; ?dl=1
          forces download.
      - name: Key-Value Store
        description: 1000-key namespaced KV stores via /api/kv with per-key PUT/GET/DELETE and per-store enumeration.
      - name: JSON Document Store
        description: 10,000-document collections via /api/json with PUT-in-place semantics on stable short URLs.
      - name: Update In Place
        description: >-
          PUT to /api/html, /api/json, and /api/kv replaces content while keeping the short URL — agents can iterate
          without breaking shared links.
      - name: Owner Token Grouping
        description: >-
          Save the `ownerToken` returned at creation and reuse it via `X-Owner-Token` to group resources under one owner
          and scope list endpoints.
      - name: Password Protection
        description: >-
          Set `X-Password` (min 4 chars) at creation to require the same header (or `?p=...`) for reads; passworded
          items are excluded from the gallery and sitemap.
      - name: Public Gallery
        description: >-
          GET /api/gallery surfaces content posted to the default `public` namespace without a password — searchable,
          social-bot friendly, OG-image generated.
      - name: OpenGraph Preview Images
        description: Per-content 1200×630 PNG at /preview/{ns}/{id}.png plus an /preview-html stub for social media unfurlers.
      - name: Short Link Resolver
        description: GET /{ns}/{id} returns the hosted content; GET /{ns}/{id}/{sub} resolves sub-paths inside multi-file sites.
      - name: Idempotent Owner Re-POST
        description: >-
          A byte-identical POST /api/html to `public/` within 24h returns the existing id (X-Existing-Resource header
          set) so retries do not duplicate gallery entries.
      - name: Abuse Reports
        description: POST /api/reports lets readers report inappropriate or harmful content for moderation.
      - name: Random Namespace Suggestion
        description: GET /api/namespace/random returns a fresh, collision-free kebab-case namespace suggestion.
      - name: Platform Stats
        description: >-
          GET /api/stats exposes platform-wide usage statistics; GET /api/sitemap.xml exposes a dynamic sitemap of
          public content.
      - name: AI-Agent Friendly
        description: >-
          llms.txt and llms-full.txt manifests, an MCP server, a Claude Code skill, and required identifying User-Agent
          headers make BrewPage first-class for autonomous agents.
