aid: brewpage
url: https://raw.githubusercontent.com/api-evangelist/brewpage/refs/heads/main/apis.yml
name: BrewPage
type: Index
accessModel:
  pricing: free
  onboarding: open
  trial: false
  try_now: true
  public: true
  label: Free · Open access
  confidence: medium
  source:
  - plans
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/brewpage.png
description: >-
  BrewPage is a free, no-registration instant hosting service for HTML pages, Markdown documents, AI-agent artifacts,
  files, and multi-file static sites. It also offers a namespaced key-value store and a JSON document store. The REST
  API returns short, shareable HTTPS links (https://brewpage.app/{ns}/{id}) and an owner token used to update or delete
  content in place. BrewPage is designed to be AI-agent friendly: it provides an MCP server (brewpage-mcp), a Claude
  Code skill (brewdoc:publish), and a llms.txt manifest, and it requires a self-identifying User-Agent header on every
  request.
created: '2026-05-16'
modified: '2026-05-19'
specificationVersion: '0.23'
tags:
  - Hosting
  - Markdown
  - HTML
  - AI Artifacts
  - File Hosting
  - Developer Tools
